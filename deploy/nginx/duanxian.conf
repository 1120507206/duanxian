upstream duanxian_api {
    server 127.0.0.1:8080;
    # 与后端保持长连接，避免每个 API 请求都重新握手
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/duanxian/frontend/dist;
    index index.html;

    access_log /var/log/nginx/duanxian.access.log;
    error_log /var/log/nginx/duanxian.error.log;

    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # add_header 不与父级合并：下面每个 block 都得自带安全响应头，否则继承不到。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # 带 hash 的资源强缓存，index.html 必须每次回源校验，
    # 否则发版后浏览器拿旧 HTML 去请求已删除的旧 hash 文件会白屏。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }

    # SSE 长连接单独一条 location。
    #
    # 精确匹配优先级高于下面的 /api/ 前缀匹配，所以这条会先生效。
    # 必须关掉 proxy_buffering：否则事件会攒在 Nginx 里成批吐，前端看到的
    # 就不是「封板瞬间」了；读超时要远大于后端 25 秒的心跳间隔，30 秒那种
    # 默认值会让连接在每个心跳间隙被掐断、反复重连。
    #
    # access_log 关掉：EventSource 不能带自定义头，会话 token 只能走 query，
    # 而默认 access log 会记录完整 $request（含 query）。等以后换成一次性
    # ticket 再打开。
    location = /api/ztlive/stream {
        access_log off;

        proxy_pass http://duanxian_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://duanxian_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与 upstream keepalive 配合：清掉默认的 Connection: close
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
