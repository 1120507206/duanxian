<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>涨停播报 - 短线侠</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 在 Vue 挂载前同步应用主题，避免首屏主题闪烁（FOUC）。
      //
      // 独立页（通达信等面板嵌入用）默认深色，与主站的主题开关「互不影响」：
      // 使用独立的 localStorage 键 duanxian:ztliveTheme，避免主站切浅色时
      // 把嵌在面板里的独立页也带成浅色。
      (function () {
        try {
          var KEY = 'duanxian:ztliveTheme'
          var stored = window.localStorage.getItem(KEY)
          var mode = stored === 'light' || stored === 'dark' ? stored : 'dark'
          var root = document.documentElement
          if (mode === 'dark') root.classList.add('dark')
          else root.classList.remove('dark')
          root.style.colorScheme = mode
        } catch (e) {
          // localStorage 不可用时回退默认深色
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/entries/ztlive.js"></script>
  </body>
</html>
